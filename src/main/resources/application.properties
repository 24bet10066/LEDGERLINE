spring.application.name=ledgerline
server.port=${PORT:8080}
spring.datasource.url=${LEDGERLINE_DB_URL:jdbc:mysql://localhost:3306/ledgerline?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${LEDGERLINE_DB_USER:ledgerline}
spring.datasource.password=${LEDGERLINE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.cache=false
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health,info
