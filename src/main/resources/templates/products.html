<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>LEDGERLINE / Products</title><link rel="stylesheet" href="/css/app.css"></head><body><aside th:replace="~{fragments :: nav}"></aside><main class="shell"><header><div><p class="eyebrow">PRODUCTS</p><h1>Catalog and cost.</h1></div></header><div class="panel"><h2>Add product</h2><div class="alert" th:if="${productError}" th:text="${productError}"></div><form class="grid-form" method="post" action="/products"><input type="hidden" name="action" value="create"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>SKU<input name="sku" required></label><label>Name<input name="name" required></label><label>Category<select name="categoryId" required><option value="">Select category</option><option th:each="category:${categories}" th:value="${category.id}" th:text="${category.name}"></option></select></label><label>Supplier<select name="supplierId" required><option value="">Select supplier</option><option th:each="supplier:${suppliers}" th:value="${supplier.id}" th:text="${supplier.name}"></option></select></label><label>Reorder level<input name="reorderLevel" type="number" step=".001" min="0" required></label><label>Cost<input name="cost" type="number" step=".01" min="0" required></label><label>Price<input name="price" type="number" step=".01" min="0" required></label><button class="primary">Create product</button></form></div><div class="panel table-wrap"><table><thead><tr><th>SKU</th><th>PRODUCT</th><th>CATEGORY</th><th>COST</th><th>PRICE</th><th>STATUS</th></tr></thead><tbody><tr th:each="p:${products}"><td class="mono" th:text="${p.sku}"></td><td><strong th:text="${p.name}"></strong></td><td th:text="${p.category?.name}"></td><td th:text="${p.cost}"></td><td th:text="${p.price}"></td><td>ACTIVE</td></tr></tbody></table></div></main></body></html>
