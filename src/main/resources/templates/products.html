<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>LEDGERLINE / Products</title><link rel="stylesheet" href="/css/app.css"></head><body><aside th:replace="~{fragments :: nav}"></aside><main class="shell"><header><div><p class="eyebrow">PRODUCTS</p><h1>Catalog and cost.</h1></div></header><div class="panel"><h2>Add product</h2><form class="grid-form" method="post" action="/products"><input type="hidden" name="action" value="create"><label>SKU<input name="sku" required></label><label>Name<input name="name" required></label><label>Category ID<input name="categoryId" type="number" required></label><label>Supplier ID<input name="supplierId" type="number" required></label><label>Reorder level<input name="reorderLevel" type="number" step=".001" required></label><label>Cost<input name="cost" type="number" step=".01" required></label><label>Price<input name="price" type="number" step=".01" required></label><button class="primary">Create product</button></form></div><div class="panel table-wrap"><table><thead><tr><th>SKU</th><th>PRODUCT</th><th>CATEGORY</th><th>COST</th><th>PRICE</th><th>STATUS</th></tr></thead><tbody><tr th:each="p:${products}"><td class="mono" th:text="${p.sku}"></td><td><strong th:text="${p.name}"></strong></td><td th:text="${p.category?.name}"></td><td th:text="${p.cost}"></td><td th:text="${p.price}"></td><td>ACTIVE</td></tr></tbody></table></div></main></body></html>
