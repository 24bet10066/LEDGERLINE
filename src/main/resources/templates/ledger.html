<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>LEDGERLINE / Ledger</title><link rel="stylesheet" href="/css/app.css"></head><body><aside th:replace="~{fragments :: nav}"></aside><main class="shell"><header><div><p class="eyebrow">STOCK LEDGER</p><h1>Nothing disappears.</h1></div><a class="primary button" href="/export.csv">Export CSV</a></header><div class="panel table-wrap"><table><thead><tr><th>REFERENCE</th><th>PRODUCT</th><th>WAREHOUSE</th><th>QUANTITY</th><th>TYPE</th><th>WHEN</th></tr></thead><tbody><tr th:each="r:${rows}"><td class="mono" th:text="${r.reference}"></td><td th:text="${r.product}"></td><td th:text="${r.warehouse}"></td><td th:text="${r.quantity}"></td><td><span class="tag" th:text="${r.type}"></span></td><td th:text="${r.created_at}"></td></tr></tbody></table></div></main></body></html>
