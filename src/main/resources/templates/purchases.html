<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>LEDGERLINE / Purchasing</title><link rel="stylesheet" href="/css/app.css"></head><body><aside th:replace="~{fragments :: nav}"></aside><main class="shell"><header><div><p class="eyebrow">PURCHASING</p><h1>Buy first. Receive later.</h1></div></header><div class="panel"><h2>Create purchase order</h2><form class="grid-form" method="post" action="/purchases"><label>Order number<input name="orderNumber" required></label><label>Supplier ID<input name="supplierId" type="number" required></label><label>Warehouse ID<input name="warehouseId" type="number" required></label><label>Product ID<input name="productId" type="number" required></label><label>Quantity<input name="quantity" type="number" step=".001" required></label><label>Cost<input name="cost" type="number" step=".01" required></label><button class="primary">Save draft</button></form></div><div class="panel table-wrap"><table><thead><tr><th>ORDER</th><th>SUPPLIER</th><th>WAREHOUSE</th><th>STATUS</th><th>DATE</th><th></th></tr></thead><tbody><tr th:each="p:${purchases}"><td class="mono" th:text="${p.orderNumber}"></td><td th:text="${p.supplier.name}"></td><td th:text="${p.warehouse.name}"></td><td><span class="tag" th:text="${p.status}"></span></td><td th:text="${p.orderedAt}"></td><td><form th:if="${p.status=='DRAFT'}" method="post" th:action="@{'/purchases/'+${p.id}+'/approve'}"><button>Approve</button></form><a th:if="${p.status=='APPROVED' or p.status=='PARTIALLY_RECEIVED'}" href="/inventory">Receive →</a></td></tr></tbody></table></div></main></body></html>
