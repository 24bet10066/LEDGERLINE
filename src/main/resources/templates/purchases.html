<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>LEDGERLINE / Purchasing</title><link rel="stylesheet" href="/css/app.css"></head><body><aside th:replace="~{fragments :: nav}"></aside><main class="shell"><header><div><p class="eyebrow">PURCHASING</p><h1>Buy first. Receive later.</h1></div></header><div class="panel"><h2>Create purchase order</h2><form class="grid-form" method="post" action="/purchases"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Order number<input name="orderNumber" required></label><label>Supplier ID<input name="supplierId" type="number" required></label><label>Warehouse ID<input name="warehouseId" type="number" required></label><label>Product ID<input name="productId" type="number" required></label><label>Quantity<input name="quantity" type="number" step=".001" required></label><label>Cost<input name="cost" type="number" step=".01" required></label><button class="primary">Save draft</button></form></div><div class="panel table-wrap"><table><thead><tr><th>ORDER</th><th>SUPPLIER</th><th>WAREHOUSE</th><th>PRODUCT</th><th>ORDERED</th><th>RECEIVED</th><th>STATUS</th><th>DATE</th><th>ACTION</th></tr></thead><tbody><tr th:each="p:${purchases}"><td class="mono" th:text="${p.orderNumber}"></td><td th:text="${p.supplier}"></td><td th:text="${p.warehouse}"></td><td><span th:text="${p.sku}"></span> <span class="muted" th:text="${p.product}"></span></td><td th:text="${p.orderedQty}"></td><td th:text="${p.receivedQty}"></td><td><span class="tag" th:text="${p.status}"></span></td><td th:text="${p.orderedAt}"></td><td><form th:if="${p.status=='DRAFT'}" method="post" th:action="@{'/purchases/'+${p.id}+'/approve'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Approve</button></form><form th:if="${p.status=='APPROVED' or p.status=='PARTIALLY_RECEIVED'}" class="grid-form" method="post" th:action="@{'/purchases/'+${p.id}+'/receive'}"><input type="hidden" name="productId" th:value="${p.productId}"><input type="hidden" name="warehouseId" th:value="${p.warehouseId}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="locationId" required><option value="">Location</option><option th:each="l:${locations}" th:if="${l.warehouse.id == p.warehouseId}" th:value="${l.id}" th:text="${l.code}"></option></select><input name="quantity" type="number" min=".001" step=".001" th:max="${p.orderedQty - p.receivedQty}" required><button class="primary">Receive</button></form></td></tr></tbody></table></div></main></body></html>
