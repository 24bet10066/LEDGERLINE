services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ledgerline
      MYSQL_USER: ledgerline
      MYSQL_PASSWORD: ledgerline-local
      MYSQL_ROOT_PASSWORD: root-local
    ports: ["3307:3306"]
    volumes: [ledgerline-mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uledgerline", "-pledgerline-local"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      LEDGERLINE_DB_URL: jdbc:mysql://mysql:3306/ledgerline?serverTimezone=UTC
      LEDGERLINE_DB_USER: ledgerline
      LEDGERLINE_DB_PASSWORD: ledgerline-local
      LEDGERLINE_ADMIN_EMAIL: admin@ledgerline.local
      LEDGERLINE_ADMIN_PASSWORD: change-me-now
    ports: ["8080:8080"]
volumes:
  ledgerline-mysql:
