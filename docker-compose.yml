
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ledgerline
      MYSQL_USER: ${LEDGERLINE_DB_USER:-ledgerline}
      MYSQL_PASSWORD: ${LEDGERLINE_DB_PASSWORD:?Set LEDGERLINE_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${LEDGERLINE_MYSQL_ROOT_PASSWORD:?Set LEDGERLINE_MYSQL_ROOT_PASSWORD in .env}
    ports: ["3307:3306"]
    volumes: [ledgerline-mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      LEDGERLINE_DB_URL: jdbc:mysql://mysql:3306/ledgerline?serverTimezone=UTC
      LEDGERLINE_DB_USER: ${LEDGERLINE_DB_USER:-ledgerline}
      LEDGERLINE_DB_PASSWORD: ${LEDGERLINE_DB_PASSWORD:?Set LEDGERLINE_DB_PASSWORD in .env}
      LEDGERLINE_ADMIN_EMAIL: ${LEDGERLINE_ADMIN_EMAIL:?Set LEDGERLINE_ADMIN_EMAIL in .env}
      LEDGERLINE_ADMIN_PASSWORD: ${LEDGERLINE_ADMIN_PASSWORD:?Set LEDGERLINE_ADMIN_PASSWORD in .env}
    ports: ["8080:8080"]

volumes:
  ledgerline-mysql:
